name: brokly_mobile
description: Brokly CRM native mobile app using the same Supabase backend as the web app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  call_log: ^6.0.1
  flutter:
    sdk: flutter
  flutter_overlay_window: ^0.5.0
  geolocator: ^14.0.3
  go_router: ^14.2.7
  intl: ^0.20.3
  lucide_icons_flutter: 3.1.20
  permission_handler: ^13.0.2
  phone_state: ^4.0.1
  provider: ^6.1.5+1
  supabase_flutter: ^2.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
