name: Build Flutter Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          cd mobile_flutter
          flutter config --no-analytics
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter pub get

      - name: Build Flutter APK
        run: |
          cd mobile_flutter
          chmod +x android/gradlew
          flutter doctor -v
          flutter build apk --debug 2>&1 | tee build_output.log || {
            echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Stage APK for Upload
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp -vf {} output_apk/brokly-app-debug.apk \;
          pwd
          ls -lh output_apk/
          echo "APK_EXISTS=$(test -f output_apk/brokly-app-debug.apk && echo 'true' || echo 'false')"

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: brokly-flutter-app-apk
          path: ${{ github.workspace }}/output_apk/brokly-app-debug.apk
          if-no-files-found: warn
          retention-days: 14
