name: Build Flutter Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          cd mobile_flutter
          flutter config --no-analytics
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          flutter pub get

      - name: Build Flutter APK
        run: |
          cd mobile_flutter
          chmod +x android/gradlew
          flutter doctor -v
          flutter build apk --debug
          cd ..
          mkdir -p final_apk
          find build -name "*.apk" -exec cp -v {} final_apk/app-debug.apk \; || true
          find mobile_flutter -name "*.apk" -exec cp -v {} final_apk/app-debug.apk \; || true
          ls -lh final_apk/

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: brokly-flutter-app-apk
          path: final_apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
